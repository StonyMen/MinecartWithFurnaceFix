# ===== MinecartWithFurnaceFix ===== #

# 总开关（默认: true）
enabled: true

train:
  # 相邻车厢中心间距，格（默认: 1.5）
  spacing: 1.5

  # 行驶中每 tick 向标准间距靠拢的最大距离，格；0 关闭（默认: 0.03）
  spacing-converge: 0.03

  # 一列最多几个实体，含动力车（默认: 5）
  max-members: 5

  # 编组最大弧长跨度，同时是寻找车厢的搜索半径，格（默认: 8.0）
  max-length: 8.0

  # 判定为同一根轨道的横向容差，格（默认: 0.75）
  max-offset: 0.75

  # 引擎连续多少 tick 找不到轨道就解散整组（默认: 60）
  path-fail-limit: 60

  # 同一辆车两次编组尝试的间隔，tick（默认: 10）
  scan-interval: 10

  # 前方无轨道时解散整组并清空燃料；线路正常到终点也会触发（默认: true）
  clear-fuel-on-derail: true

path:
  # 每次探路缓存的轨道长度，格（默认: 64）
  lookahead-blocks: 64

physics:
  # 有燃料时的恒定速度，格/tick（默认: 0.2）
  cruise-speed: 0.2

  # 无燃料滑行时的速度上限，格/tick（默认: 0.4）
  max-speed: 0.4

  # 每 tick 保留的速度比例（默认: 0.997）
  friction: 0.997

  # 坡度重力，格/tick^2；仅无燃料滑行时生效（默认: 0.0075）
  gravity: 0.0075

  # 无燃料滑行时每 tick 的额外减速，格/tick^2（默认: 0.0）
  rolling-resistance: 0.0

  # 低于此速度直接归零，格/tick（默认: 0.001）
  stop-speed: 0.001


debug: false
