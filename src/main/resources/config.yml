# MinecartWithFurnaceFix
#
# 只重写"车厢之间怎么连"这一层。动力矿车本身仍是原版实体：燃料、右键点火、
# 推力向量都由原版维护；整组共享一个速度和每节车的弧长偏移，位置按轨道反查。

enabled: true

train:
  # 相邻车厢中心间距，格。车宽 0.98，代码下限 1.0。
  spacing: 1.5

  # 行驶中每 tick 向"第 N 节 = N × spacing"靠拢的最大距离，格。0 关闭。
  spacing-converge: 0.03

  # 一列最多几个实体（含动力车）。原版合并车没有上限，这里只是安全限制。
  max-members: 5

  # 编组最大弧长跨度，同时是找车的水平搜索半径，格。下限 spacing × (max-members - 1)。
  max-length: 8.0

  # 判定"在同一根轨道上"的横向容差，格。平行轨道间距 1.0，0.75 不会误粘邻线。
  max-offset: 0.75

  # 车厢偏离自己槽位超过这个值就释放，格。安全网，管 /tp、传送门等外部位移。
  break-distance: 6.0

  # 车厢离动力车超过这个值就释放，格。0 = 跟随 max-length。
  detach-distance: 0.0

  # 引擎连续多少 tick 解析不出轨道就解散整组。60 tick = 3 秒。
  path-fail-limit: 60

  # 同一辆车两次编组尝试的最小间隔，tick。10 tick = 0.5 秒。
  scan-interval: 10

  # 前方没有铁轨（被挖断或线路到头）时立即解散整组，每节车交回原版。
  # 注意：线路正常到终点也走这条路径，到站的车会当场散架。
  # 解散时是否清空燃料：不清的话车会带着燃料冲出断口，可能又和刚甩掉的车重新编组。
  clear-fuel-on-derail: true

path:
  # 每次探路缓存多少格轨道。下限 max-members + 2。
  lookahead-blocks: 64

physics:
  # 以下三项照抄原版矿车：
  #   cruise-speed 0.2 = 4 格/秒，动力矿车的恒定速度（一份煤 3600 tick 跑 720 格）
  #   max-speed    0.4 = 8 格/秒，原版所有矿车的硬上限
  #   friction   0.997 = 每 tick 保留的速度比例
  cruise-speed: 0.2
  max-speed: 0.4
  friction: 0.997

  # 坡度重力，格/tick^2。只在没燃料滑行时生效（有燃料是恒速，与坡度无关）。
  # 原版每 1 格落差改变 0.75 格/秒速度，换算到 0.2 格/tick 约 0.0075。
  gravity: 0.0075

  # 滑行时每 tick 的恒定减速，格/tick^2。原版没有这一项，默认 0。
  rolling-resistance: 0.0

  # 低于这个速度且坡度拉力也不足就直接归零，避免浮点尾巴让车永远蠕动。
  stop-speed: 0.001

# 打开后会把成组、补挂、释放（带原因）、解散、探路失败打到控制台。
debug: false
