# MinecartWithFurnaceFix
#
# 只重写“车厢之间怎么连”这一层。动力矿车本身仍然是原版实体：照样烧煤、
# 照样右键点火、燃料值和推力向量都由原版维护，插件只读不写。
#
# 一列车的状态只有两个数：整组共享的标量速度，以及每节车厢相对动力车的
# 弧长偏移。位置由这两个数在轨道上反查，所以弯道不会把列车拽开。
#
# 原版矿车实体被钉住（maxSpeed=0、noPhysics=true），位置由插件写。离开
# 编组时这两个状态会被恢复成原版值，否则车厢会永远停在原地。

enabled: true

train:
  # 相邻车厢的中心间距，格。同时是“两节车算不算挤在同一个槽位”的阈值。
  #
  # 不能小于 1.0（矿车碰撞箱宽 0.98，再小就永久重叠），代码会强制夹到 1.0。
  # 首次成组时，挤得太近的车会被推开到这个间距；后来手动塞进来的车如果
  # 与已有成员差不到这个值，会直接被拒绝加入。
  #
  # 调大：弯道上车厢交叠更少，但整列变长，max-length 要跟着放大。
  spacing: 1.05

  # 一列最多几个实体，**包含动力车自己**。
  #
  # 原版是“一辆车头最多带四辆”，所以这里应该是 5（引擎 + 4 节车厢）。
  # 写成 4 就只能带 3 节。
  max-members: 5

  # 编组的最大弧长跨度，格。同时是找车时的水平搜索半径。
  #
  # 必须 >= spacing x (max-members - 1)，代码会自动抬到这个下限。
  # max-members=5、spacing=1.05 时列车最长 4.2 格，8.0 有足够余量。
  #
  # 调大会让每次慢扫的实体遍历变贵（体积正比于平方），不建议超过 16。
  max-length: 8.0

  # 判定“在同一根轨道上”的横向容差，格。
  #
  # 平行轨道中心距是 1.0，所以 0.75 保证隔壁轨道上的车一定进不来。
  # 调到 1.0 以上会开始误粘邻线；调到 0.5 以下弯道切角处的车会挂不上。
  max-offset: 0.75

  # 车厢“应该在的位置”和“实际所在位置”的偏差超过这个值就释放，格。
  #
  # 位置由插件每 tick 写入，正常永远接近 0，所以这是纯安全网，用于：
  # 被别的插件传送、玩家 /tp、传送门、区块重载后位置错乱。
  #
  # 代码下限 1.0。不要低于 2.0：玩家坐在车上卡顿一下就可能误触发。
  break-distance: 6.0

  # 车厢离**动力车**的直线距离超过这个值就立即释放，格。
  #
  # 与 break-distance 的区别：break-distance 比的是“车厢 vs 它的槽位”，
  # 这一项比的是“车厢 vs 引擎的实际位置”。它不依赖任何内存记录，所以动力
  # 车被打掉、被 tp 走、被别的插件抢走时，车厢都能靠它脱身。
  #
  # 0 表示跟随 max-length，即默认行为与旧版一致。
  # 想更严格可以填 6.0（列车最长 4.2 格，留 1.8 格余量）。
  # 填 1.5 就只能带一节车厢 —— 第二节车厢的偏移就已经是 2.1 格。
  detach-distance: 0.0

  # 引擎所在位置连续多少 tick 解析不出轨道就解散整组。
  #
  # 覆盖“动力车掉下轨道 / 被炸到轨道外 / 轨道被拆”的情况：这类编组永远
  # 无法再定位，不解散的话车厢会一直保持钉死状态。100 tick = 5 秒宽限。
  path-fail-limit: 100

  # 同一辆车的两次编组尝试之间的最小间隔，tick。
  #
  # 存在的唯一原因是限制流：矿车移动时每 tick 都会触发事件，不冷却就是
  # 每 tick 一次 48 格探路。10 tick = 0.5 秒识别延迟。
  scan-interval: 10

path:
  # 每次探路缓存多少格轨道。
  #
  # 这个值不只是缓存大小，它决定弯道稳不稳：缓存段长，引擎整个弯道都夹在
  # 段中间，永远不会成为新路径的起点。而起点落在弯道方块里时切向是 45°，
  # 第一步该走哪条边是二选一的。
  #
  # 代码下限 max-members + 2。低于 16 会让弯道被当成起点，问题复现。
  lookahead-blocks: 48

physics:
  # 整组速度上限，格/tick。0.4 = 8 格/秒，与同时期原版矿车一致。
  #
  # 调过 0.5 之后客户端插值会开始抖（每 tick 位移超过半格，玩家预测要回滚）。
  max-speed: 0.4

  # 有燃料时每 tick 加的速度，格/tick。
  #
  # 稳态速度 = acceleration / (1 - friction) = 0.006 / 0.003 = 2.0，
  # 远高于 max-speed，所以加速阶段的真正上限是 max-speed。0 到 0.4 约 74
  # tick（3.7 秒），和原版手感接近。
  #
  # 调大：起步更冲。调小：起步发肉。
  acceleration: 0.006

  # 每 tick 保留的速度比例。0.997 是原版矿车的摩擦值。
  #
  # 注意它在加速阶段几乎不起作用（稳态速度被 max-speed 截断），主要影响
  # 松开动力后的滑行质感。必须小于 1.0，等于 1.0 就永远停不下来。
  friction: 0.997

  # 坡度重力，格/tick^2。上坡按 tangent.y 扣速度，下坡加回来。
  #
  # 加速的净余量只有 acceleration - 摩擦损耗 ≈ 0.0048，所以：
  #   1/3 坡（tangent.y = 0.316）需要 gravity < 0.015 才爬得动
  #   1/1 坡（tangent.y = 0.707）需要 gravity < 0.0068
  # 默认 0.02 时任何坡都上不去，平地上完全无感。铺坡道前先降到 0.012。
  gravity: 0.02

  # 没有燃料时每 tick 的恒定减速，格/tick^2。
  #
  # 这是主要的刹车手段：与摩擦叠加后，从满速滑行到静止约 182 tick（9 秒）。
  rolling-resistance: 0.001

  # 低于这个速度且没动力就直接归零，格/tick。避免浮点尾巴导致永远蠕动。
  # 调到 0.01 会让停车显得很硬，别低于 0.001。
  stop-speed: 0.002

# 打开后会把成组、补挂、释放（带原因）、解散、探路失败打到控制台。
# 调参时开，平时关 —— 异常情况下 release 可能每 tick 刷一次。
debug: false
