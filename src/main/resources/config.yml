# MinecartWithFurnaceFix
#
# 只重写“车厢之间怎么连”这一层。动力矿车本身仍然是原版实体：照样烧煤、
# 照样右键点火、燃料值和推力向量都由原版维护，插件只读不写。
#
# 一列车的状态只有两个数：整组共享的标量速度，以及每节车厢相对动力车的
# 弧长偏移。位置由这两个数在轨道上反查，所以弯道不会把列车拽开。
#
# 原版矿车实体被钉住（maxSpeed=0、noPhysics=true），位置由插件写。离开
# 编组时这两个状态会被恢复成原版值，否则车厢会永远停在原地。

enabled: true

train:
  # 相邻车厢的中心间距，格。同时是“两节车算不算挤在同一个槽位”的阈值。
  #
  # 不能小于 1.0（矿车碰撞箱宽 0.98，再小就永久重叠），代码会强制夹到 1.0。
  # 首次成组时，挤得太近的车会被推开到这个间距；后来手动塞进来的车如果
  # 与已有成员差不到这个值，会直接被拒绝加入。
  #
  # 调大：弯道上车厢交叠更少，但整列变长，max-length 要跟着放大。
  spacing: 1.5

  # 运行中每 tick 让车厢沿轨滑向“自己名次对应槽位”的最大距离，格。
  #
  # 成组时的间距是车厢当时停的位置（只要不小于 spacing 就保留），所以可能
  # 是 1.05、3.2、1.8 这样参差不齐。列车一开动，每节车就会向
  # “第 N 节 = N x spacing”的位置靠拢，最终所有间距完全一致。
  #
  # 只在实际移动时生效：停着的列车不动，免得和正在摆放车厢的玩家抢。
  # 设为 0 关闭这个功能。
  #
  # 0.03 意味着 3 格误差需要 100 tick（5 秒）走完，过程看不出跳变。
  spacing-converge: 0.03

  # 一列最多几个实体，**包含动力车自己**。
  #
  # 原版是“一辆车头最多带四辆”，所以这里应该是 5（引擎 + 4 节车厢）。
  # 写成 4 就只能带 3 节。
  max-members: 5

  # 编组的最大弧长跨度，格。同时是找车时的水平搜索半径。
  #
  # 必须 >= spacing x (max-members - 1)，代码会自动抬到这个下限。
  # max-members=5、spacing=1.05 时列车最长 4.2 格，8.0 有足够余量。
  #
  # 调大会让每次慢扫的实体遍历变贵（体积正比于平方），不建议超过 16。
  max-length: 8.0

  # 判定“在同一根轨道上”的横向容差，格。
  #
  # 平行轨道中心距是 1.0，所以 0.75 保证隔壁轨道上的车一定进不来。
  # 调到 1.0 以上会开始误粘邻线；调到 0.5 以下弯道切角处的车会挂不上。
  max-offset: 0.75

  # 车厢“应该在的位置”和“实际所在位置”的偏差超过这个值就释放，格。
  #
  # 位置由插件每 tick 写入，正常永远接近 0，所以这是纯安全网，用于：
  # 被别的插件传送、玩家 /tp、传送门、区块重载后位置错乱。
  #
  # 代码下限 1.0。不要低于 2.0：玩家坐在车上卡顿一下就可能误触发。
  break-distance: 6.0

  # 车厢离**动力车**的直线距离超过这个值就立即释放，格。
  #
  # 与 break-distance 的区别：break-distance 比的是“车厢 vs 它的槽位”，
  # 这一项比的是“车厢 vs 引擎的实际位置”。它不依赖任何内存记录，所以动力
  # 车被打掉、被 tp 走、被别的插件抢走时，车厢都能靠它脱身。
  #
  # 0 表示跟随 max-length，即默认行为与旧版一致。
  # 想更严格可以填 6.0（列车最长 4.2 格，留 1.8 格余量）。
  # 填 1.5 就只能带一节车厢 —— 第二节车厢的偏移就已经是 2.1 格。
  detach-distance: 0.0

  # 引擎所在位置连续多少 tick 解析不出轨道就解散整组。
  #
  # 覆盖“动力车掉下轨道 / 被炸到轨道外 / 轨道被拆”的情况：这类编组永远
  # 无法再定位，不解散的话车厢会一直保持钉死状态。100 tick = 5 秒宽限。
  path-fail-limit: 100

  # 同一辆车的两次编组尝试之间的最小间隔，tick。
  #
  # 存在的唯一原因是限制流：矿车移动时每 tick 都会触发事件，不冷却就是
  # 每 tick 一次 48 格探路。10 tick = 0.5 秒识别延迟。
  scan-interval: 10

path:
  # 每次探路缓存多少格轨道。
  #
  # 缓存越长，重新探路越少，弯道也更稳：引擎整个弯道都夹在缓存段中间，
  # 不会每次走到弯道里就重新解析一遍。重新解析本身已经能正确处理弯道
  # （按矿车在方块内的位置判断从哪条边出去），所以这只是减少开销。
  #
  # 代码下限 max-members + 2。每次探路成本约几十微秒，调大到 64 也无所谓。
  lookahead-blocks: 48

physics:
  # 有燃料时的行驶速度，格/tick。0.2 = 4 格/秒，就是原版动力矿车的速度
  # （比走路 4.3 格/秒略慢，一份煤正好跑 720 格 = 3600 tick x 0.2）。
  #
  # 原版动力矿车是**恒定速度**：点火瞬间就是这个速度，之后下坡不会更快，
  # 上坡也不会更慢，动力铁轨同样不起作用。这里照抄，所以不要再指望“坡度
  # 会让它变慢”或“下坡会越跑越快”。
  #
  # 恒定速度还有个副作用是好的：速度跟坡度无关，再陡的 45° 坡也照样爬，
  # 不存在“爬到一半顶不住、被重力拖下去、整列车倒着走”这个状态。
  #
  # 代码会把它夹到不超过 max-speed。
  cruise-speed: 0.2

  # 矿车速度上限，格/tick。0.4 = 8 格/秒，原版给所有矿车的硬上限。
  #
  # 只有**没燃料、在坡上滑行**时才会接近这个值（动力车烧完煤被重力拖着
  # 下山）。有燃料时速度由 cruise-speed 决定，与这里无关。
  max-speed: 0.4

  # ---- 以下三项只在没有燃料（滑行）时生效 ----

  # 每 tick 保留的速度比例。0.997 是原版矿车的摩擦值。
  #
  # 只影响松开动力后的滑行质感。必须小于 1.0，等于 1.0 就永远停不下来。
  friction: 0.997

  # 坡度重力，格/tick^2。上坡按 tangent.y 扣速度，下坡加回来。
  #
  # 有燃料时完全不起作用（速度被 cruise-speed 钉死），所以这里的取值不会
  # 再影响能不能爬上坡。它只决定“煤烧完之后，车在坡上是往下溜还是停在
  # 原地”：原版只有 45° 坡（tangent.y = 0.707），每 tick 的坡度拉力是
  # 0.707 x gravity = 0.0028，大于 stop-speed，所以停在坡上的死车会自己
  # 往下溜 —— 这是合理的，补一铲煤就立刻恢复 cruise-speed 往上走。
  # 0 等于没有坡度。
  gravity: 0.004

  # 没有燃料时每 tick 的恒定减速，格/tick^2。
  #
  # 这是主要的刹车手段：与摩擦叠加后，从 0.4 滑行到静止约 182 tick（9 秒），
  # 从巡航速度 0.2 停住约 100 tick（5 秒）。
  rolling-resistance: 0.001

  # 低于这个速度且坡度拉力也低于它，就直接归零，格/tick。
  # 避免浮点尾巴导致永远蠕动，同时保证停在坡上的车仍然会开始下滑。
  # 调到 0.01 会让停车显得很硬，别低于 0.001。
  stop-speed: 0.002

  # 旧版本的 physics.acceleration（每 tick 加速度）已移除：现在有燃料就是
  # 恒定 cruise-speed。配置文件里留着这个键没有影响，可以删掉。

# 打开后会把成组、补挂、释放（带原因）、解散、探路失败打到控制台。
# 调参时开，平时关 —— 异常情况下 release 可能每 tick 刷一次。
debug: false
