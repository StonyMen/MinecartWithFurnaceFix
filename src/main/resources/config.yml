# ===== MinecartWithFurnaceFix ===== #

# 总开关
enabled: true

train:
  # 矿车之间的间距，格（默认: 1.5）
  spacing: 1.5

  # 开动后把间距拉整齐的速度，格/刻（默认: 0.03）
  spacing-converge: 0.03

  # 一列车最多挂几节，含动力矿车（默认: 5）
  max-members: 5

  # 编组半径距离，格（默认: 8.0）
  max-length: 8.0

  # 判定为同一根轨道的横向容差，格（默认: 0.75）
  max-offset: 0.75

  # 多久检查一次附近有没有车要编组，刻（默认: 10）
  scan-interval: 10


path:
  # 一次向前看多少格的轨道，格。一般不用动（默认: 64）
  lookahead-blocks: 64

physics:
  # 有燃料时的矿车速度，格/刻（默认: 0.2）
  cruise-speed: 0.2

  # 没燃料时的最高滑行速度，格/刻（默认: 0.4）
  max-speed: 0.4

  # 滑行时速度每刻剩多少（默认: 0.997）
  friction: 0.997

  # 坡道的拉扯力度（默认: 0.0075）
  gravity: 0.0075

  # 额外的滑行阻力（默认: 0.0）
  rolling-resistance: 0.0

  # 低于此速度直接归零，格/刻（默认: 0.001）
  stop-speed: 0.001


debug: false
